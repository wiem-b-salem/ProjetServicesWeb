name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install and build auth service
        run: |
          cd services/auth-service
          npm install
          npm run build

  build-vehicle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install and build vehicle service
        run: |
          cd services/vehicle-service
          npm install
          npm run build

  build-traffic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install and build traffic service
        run: |
          cd services/traffic-service
          npm install
          npm run build

  build-incident:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install and build incident service
        run: |
          cd services/incident-service
          npm install
          npm run build

  build-notification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install and build notification service
        run: |
          cd services/notification-service
          npm install
          npm run build

  build-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install and build gateway
        run: |
          cd gateway
          npm install
          npm run build

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install and build frontend
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build